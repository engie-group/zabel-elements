    - zabel.elements.clients++
  - clients/artifactory.md:
    - zabel.elements.clients.Artifactory@
  - clients/atlassian.md:
    - zabel.elements.clients.Atlassian@
  - clients/confluence.md:
    - zabel.elements.clients.Confluence@
  - clients/confluencecloud.md:
    - zabel.elements.clients.ConfluenceCloud@
  - clients/github.md:
    - zabel.elements.clients.GitHub@
  - clients/githubcloud.md:
    - zabel.elements.clients.GitHubCloud@
  - clients/gitlab.md:
    - zabel.elements.clients.GitLab@
  - clients/jenkins.md:
    - zabel.elements.clients.CloudBeesJenkins@
  - clients/jira.md:
    - zabel.elements.clients.Jira@
  - clients/jiracloud.md:
    - zabel.elements.clients.JiraCloud@
  - clients/kubernetes.md:
    - zabel.elements.clients.Kubernetes@
  - clients/okta.md:
    - zabel.elements.clients.Okta@
  - clients/sonarqube.md:
    - zabel.elements.clients.SonarQube@
  - clients/sonatypenexus.md:
    - zabel.elements.clients.SonatypeNexus@
  - clients/squashtm.md:
    - zabel.elements.clients.SquashTM@
  - images/index.md:
    - zabel.elements.images
  - images/utilityapp.md:
    - zabel.elements.images.UtilityApp++
  - images/managedserviceapp.md:
    - zabel.elements.images.ManagedServiceApp++
  - images/artifactory.md:
    - zabel.elements.images.Artifactory++
  - images/cloudbeesjenkins.md:
    - zabel.elements.images.CloudBeesJenkins++
  - images/confluence.md:
    - zabel.elements.images.Confluence++
  - images/github.md:
    - zabel.elements.images.GitHub++
  - images/kubernetes.md:
    - zabel.elements.images.Kubernetes++
  - images/jira.md:
    - zabel.elements.images.Jira++
  - images/sonarqube.md:
    - zabel.elements.images.SonarQube++
  - images/squashtm.md:
    - zabel.elements.images.SquashTM++
  - images/okta.md:
    - zabel.elements.images.Okta++

pages:
  - Home: index.md << ../README.md
  - Installation: installation.md << installation.md
  - API Documentation:
    - Clients:
      - Clients Overview: clients/index.md
      - Artifactory: clients/artifactory.md
      - Atlassian: clients/atlassian.md
      - CloudBeesJenkins: clients/jenkins.md
      - Confluence: clients/confluence.md
      - ConfluenceCloud: clients/confluencecloud.md
      - GitHubCloud: clients/githubcloud.md
      - GitHubCloudDR: clients/githubcloud2.md
      - GitHubServer: clients/github.md
      - GitLab: clients/gitlab.md
      - Jira: clients/jira.md
      - JiraCloud: clients/jiracloud.md
      - Kubernetes: clients/kubernetes.md
      - Okta: clients/okta.md
      - SonarQube: clients/sonarqube.md
      - SonatypeNexus: clients/sonatypenexus.md
      - SquashTM: clients/squashtm.md
    - Images:
      - Images Overview: images/index.md
      - ManagedServiceApp: images/managedserviceapp.md
      - UtilityApp: images/utilityapp.md
      - Artifactory: images/artifactory.md
      - CloudBeesJenkins: images/cloudbeesjenkins.md
      - Confluence: images/confluence.md
      - GitHub: images/github.md
      - Kubernetes: images/kubernetes.md
      - Jira: images/jira.md
      - SonarQube: images/sonarqube.md
      - SquashTM: images/squashtm.md
      - Okta: images/okta.md

theme:
  features:
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    # - navigation.tabs
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

extra_javascript:
  - js/github-links.js
extra_css:
  - css/extra.css
  - css/github-links.css

markdown_extensions:
  - admonition            # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  - meta                  # https://www.mkdocs.org/user-guide/writing-your-docs/#meta-data
  - tables                # https://www.mkdocs.org/user-guide/writing-your-docs/#tables
  - codehilite            # https://yakworks.github.io/docmark/extensions/codehilite/
  - attr_list             # https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/#admonition
  - md_in_html
  - smarty
  - meta
  - def_list
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: "1-4"

headers: markdown
